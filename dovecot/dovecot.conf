# =============================================================================
# dovecot.conf — top-level Dovecot config for the benchmark.
#
# Kept deliberately small; the details live in conf.d/*.conf. The mail format
# (mdbox vs maildir) is NOT set here — entrypoint-dovecot.sh writes it into
# conf.d/01-mail-location.conf at startup from the $MAIL_FORMAT env var, so we
# can switch formats between benchmark runs without rebuilding the image.
# =============================================================================

# IMAP for the imaptest client; LMTP so we can also sanity-check real delivery.
protocols = imap lmtp

# Listen on all interfaces (container is on the private ceph network only).
listen = *

# Plaintext auth allowed without TLS — this is an isolated lab network and
# imaptest logs in with PLAIN. Do NOT copy this to production.
disable_plaintext_auth = no
auth_mechanisms = plain login

# Pull in everything else (auth, master/services, mail location, logging).
!include conf.d/*.conf
