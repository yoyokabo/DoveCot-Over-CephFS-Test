# =============================================================================
# 10-master.conf — service definitions, listeners, and concurrency limits.
#
# The concurrency limits are bumped well above Dovecot defaults because the
# imaptest sweep drives up to ~400 simultaneous IMAP connections. If these are
# too low, connections queue and we'd be measuring Dovecot's process limits
# instead of CephFS — exactly the artifact we want to avoid.
# =============================================================================

# Cluster-wide ceilings (per service unless overridden below).
default_client_limit = 4000
default_process_limit = 1024
default_vsz_limit = 512M

service imap-login {
  inet_listener imap {
    port = 143
  }
  # High-performance login: reuse login processes (service_count=0) and keep a
  # handful warm so connection setup isn't on the critical path.
  service_count = 0
  process_min_avail = 4
  client_limit = 4000
}

service imap {
  # One imap process can serve many clients; give plenty of headroom.
  process_limit = 1024
  client_limit = 16
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  client_limit = 8000
}

service auth-worker {
  process_limit = 64
}
