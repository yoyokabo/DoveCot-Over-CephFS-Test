# =============================================================================
# 10-ssl.conf — disable TLS.
#
# This is an isolated benchmark network and imaptest connects in plaintext, so
# we turn SSL off entirely. (The stock package config required a cert at
# /etc/pki/dovecot/certs/dovecot.pem, which we don't ship.) Never do this in
# production.
# =============================================================================
ssl = no
