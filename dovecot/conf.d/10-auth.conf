# =============================================================================
# 10-auth.conf — authentication & user database.
#
# We use a single passwd-file for both passdb (who can log in) and userdb
# (where their mail lives). The file is GENERATED at container start by
# entrypoint-dovecot.sh, one line per test account (user0001..userNNNN), all
# sharing the same password and the vmail uid/gid. No external user DB needed.
#
# passwd-file line format:
#   user:{PLAIN}password:uid:gid:gecos:home:shell:extra
# =============================================================================

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  # Defaults applied to every user (home + mail owner) if not in the file.
  default_fields = uid=vmail gid=vmail home=/srv/mail/%u
}
