# =============================================================================
# 15-namespace.conf — the default "inbox" namespace + standard folders.
#
# Defines where INBOX and the special folders live within each user's
# mail_location. imaptest SELECTs INBOX and APPENDs into it, so we keep this
# minimal but explicit (the stock package namespace file was removed).
# =============================================================================
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Sent {
    special_use = \Sent
  }
}
